name: mystic_tarot_jp
description: Mystic Tarot JP - Flutter MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.8.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Routing
  go_router: ^13.2.1
  
  # State Management
  hooks_riverpod: ^2.5.1
  
  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  # Backend
  supabase_flutter: ^2.5.2
  
  # HTTP client
  http: ^1.1.0
  
  # Audio & Haptics
  just_audio: ^0.9.36
  
  # UI & Animation
  animate_do: ^3.0.2
  appinio_swiper: ^2.1.0
  flip_card: ^0.7.0
  lottie: ^3.1.2
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.5
  webview_flutter: ^4.4.2
  uni_links: ^0.5.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Ads & Subscriptions
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.1.13
  
  # Google Sign In
  google_sign_in: ^6.1.5
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.1
  
  # Code Generation
  build_runner: ^2.4.11
  freezed: ^3.2.0
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/data/
    - assets/audio/
    - assets/images/tarot/
    - assets/images/tarot/rider_waite/
    - assets/images/tarot/cat/
    - assets/images/back_designs/
    - assets/images/spreads/
    - assets/icons/
  
  fonts:
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Regular.ttf
        - asset: assets/fonts/NotoSerifJP-Bold.ttf
          weight: 700
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700 